[package]
edition = "2024"
rust-version = "1.85.0"
name = "nostr-sdk"
version = "0.45.4"
authors = [
    "Yuki Kishimoto <yukikishimoto@protonmail.com>",
    "Nostr Dev Kit Developers",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A full-featured SDK for building high-performance and reliable nostr applications."
homepage = "https://nostrdevkit.org"
readme = "README.md"
keywords = [
    "nostr",
    "sdk",
]
license = "MIT"
repository = "https://github.com/nostrdevkit/nostr.git"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
aws_lc_rs = ["async-wsocket/aws_lc_rs"]
default = [
    "ring",
    "rustls-tls-webpki-roots",
]
local-relay = [
    "dep:nostr-memory",
    "tokio/net",
]
native-tls = ["async-wsocket/native-tls"]
native-tls-vendored = ["async-wsocket/native-tls-vendored"]
ring = ["async-wsocket/ring"]
rustls-tls-native-roots = ["async-wsocket/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["async-wsocket/rustls-tls-webpki-roots"]

[lib]
name = "nostr_sdk"
path = "src/lib.rs"

[[example]]
name = "blacklist"
path = "examples/blacklist.rs"

[[example]]
name = "bot"
path = "examples/bot.rs"

