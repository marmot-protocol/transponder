    "macros",
    "sync",
]
default-features = false

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[dependencies.tracing]
version = "0.1"
features = ["std"]
default-features = false

[dependencies.universal-time]
version = "0.3"
features = ["std"]
default-features = false

[dev-dependencies.base64]
version = "0.22"
features = ["std"]
default-features = false

[dev-dependencies.bitcoin_hashes]
version = "1.1"
default-features = false

[dev-dependencies.hyper]
version = "1.9"
