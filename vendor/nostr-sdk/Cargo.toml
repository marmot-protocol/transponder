[dependencies.async-utility]
version = "0.3"

[dependencies.async-wsocket]
version = "0.17"
features = ["socks"]

[dependencies.faster-hex]
version = "0.10"
features = ["std"]
default-features = false

[dependencies.futures]
version = "0.3"

[dependencies.lru]
version = "0.18"
default-features = false

[dependencies.negentropy]
version = "0.5"
features = ["std"]
default-features = false

[dependencies.nostr]
version = "0.45"
features = [
    "std",
    "rand",
    "os-rng",
]
default-features = false

[dependencies.nostr-database]
version = "0.45"
default-features = false

[dependencies.nostr-gossip]
version = "0.45"
default-features = false

[dependencies.nostr-memory]
version = "0.45"
optional = true
default-features = false

[dependencies.opaquerr]
version = "0.2"
features = ["alloc"]

[dependencies.rand]
version = "0.10"
features = [
    "std",
    "sys_rng",
]
default-features = false

[dependencies.tokio]
version = ">=1.37"
